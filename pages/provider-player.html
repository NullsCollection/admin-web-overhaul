<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>

<!--
  PAGE: Player details  (Phase 11a, detail template)
  Route:  /providers/[id]/players/[playerId]   (provider-player.html?id=101&player=70000)
  Source: src/pages/providers/[id]/players/[playerId]/index.tsx → views/pages/provider/player/ProviderPlayerForm.tsx
  Data:   useGetPlayer(providerId, playerId)
  Logic:  pages/provider-player.js   Mock: mock/users.js
-->
<body data-page="providers" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <a class="back-link" id="back" href="provider-players.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>Players</a>
        <div class="page-header">
          <div>
            <h1 class="page-header__title" id="pl-title">Player</h1>
            <p class="page-header__sub" id="pl-sub"></p>
          </div>
        </div>
        <div id="pl-problem" hidden></div>
        <section class="card summary" aria-label="Player" id="pl-summary"></section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>

  <script src="../assets/js/mock/users.js"></script>
  <script src="../assets/js/domain/providers.js"></script>
  <script src="../assets/js/pages/provider-player.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
