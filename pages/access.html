<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing you in | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Access link  (Phase 12)   /access?key=<token>
  Source: src/pages/access/index.tsx  (auth.loginByToken(key); spinner card "Authenticating..." →
          success redirects; failure: "Authentication Failed" + Alert (API message + "The access link may
          have expired or is invalid…") + "Go to login"; no key → "No access token provided" + toast)
  Logic:  pages/access.js   Chrome + layout: the auth split screen (pages/auth.js)
-->
<body data-page="access" data-base="../">
  <div class="auth">
    <div class="auth__art" aria-hidden="true"></div>
    <main class="auth__panel">
      <header class="auth__top" id="auth-top"></header>
      <div class="auth__body">
        <div class="auth__form" id="acc-checking" role="status" aria-live="polite">
          <span class="auth__spinner" aria-hidden="true"></span>
          <h1 class="auth__title">Signing you in…</h1>
          <p class="auth__lead">Checking your access link. This takes a few seconds.</p>
        </div>
        <div class="auth__form" id="acc-failed" hidden>
          <span class="avatar avatar--lg avatar--square auth__icon" style="color:var(--error-text);background:var(--error-soft)"><iconify-icon icon="tabler:link-off"></iconify-icon></span>
          <h1 class="auth__title" id="acc-title">This access link didn't work</h1>
          <p class="auth__lead" id="acc-text">It may have expired or already been used. Ask your admin for a new link, or log in with your email and password.</p>
          <div class="alert alert--error auth__alert" style="margin-top:20px" role="alert">
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body"><div class="alert__text" id="acc-msg"></div></div>
          </div>
          <div class="auth__actions">
            <a class="btn btn--contained btn--block" href="login.html">Go to log in</a>
          </div>
        </div>
      </div>
      <footer class="auth__foot" id="auth-foot"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/pages/access.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
