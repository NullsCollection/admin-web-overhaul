<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Providers | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Providers  (Phase 3, the LIST TEMPLATE)
  Source: src/pages/providers/index.tsx → src/views/pages/provider/ProviderTable.tsx
  Data:   useGetProviders({ page, pageSize, search, orderedBy, filter })  (server-side)
  Engine: assets/js/core/list.js   Page config + mock: assets/js/pages/providers.js

  Copy this file to start any list page. Keep the markup contract:
  [data-list-count] · [data-list-search] · select[data-list-filter] · [data-list-clear] · .list-body · [data-list-pager]
-->
<body data-page="providers" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Page header: title, live count, main action (canCreate) ============ -->
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Providers</h1>
            <p class="page-header__sub" data-list-count aria-live="polite">Loading…</p>
          </div>
          <a class="btn btn--contained" href="provider-form.html">
            <iconify-icon icon="tabler:plus"></iconify-icon>New provider
          </a>
        </div>

        <!-- ============ List card: toolbar / table / pagination ============ -->
        <section class="card list-card" id="providers-card" aria-label="Providers">
          <div class="list-toolbar">
            <!-- Search (GenericFilters "search-text") -->
            <div class="list-toolbar__search">
              <div class="field__control">
                <iconify-icon icon="tabler:search"></iconify-icon>
                <input type="search" data-list-search placeholder="Search by name, code or ID" aria-label="Search providers">
                <button type="button" class="icon-btn icon-btn--sm" data-list-search-clear aria-label="Clear search" hidden>
                  <iconify-icon icon="tabler:x"></iconify-icon>
                </button>
              </div>
            </div>

            <!-- Filters (GenericFilters "select"); "all" = no filter -->
            <div class="list-toolbar__filters">
              <div class="field__control field__control--select">
                <select id="f-currency" data-list-filter="currencyId" aria-label="Currency"></select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
              <div class="field__control field__control--select">
                <select data-list-filter="isEnable" aria-label="Status">
                  <option value="all">All statuses</option>
                  <option value="enabled">Enabled</option>
                  <option value="disabled">Disabled</option>
                </select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
            </div>

            <div class="list-toolbar__end">
              <button type="button" class="btn btn--text btn--sm" data-list-clear hidden>
                <iconify-icon icon="tabler:x"></iconify-icon>Clear filters
              </button>
            </div>
          </div>

          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/pages/providers.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
