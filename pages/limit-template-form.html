<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New limit set | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Limit number set new / edit  (Phase 9a, form template)
  New:  limit-template-form.html          → src/pages/lotto/limit-templates/new.tsx
  Edit: limit-template-form.html?id=401   → src/pages/lotto/limit-templates/[id]/index.tsx
  Form: views/pages/lotto/limit-template/v2 (useStepper: step 1 LimitTypeForm, step 2 LimitSpecialForm,
        then CompleteForm + Save)
  Engine: core/form.js (+ two custom widgets). Page logic: pages/limit-template-form.js
-->
<body data-page="lotto-limit-templates" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Header ============ -->
        <a class="back-link" href="limit-templates.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>Limit number sets</a>
        <div class="page-header">
          <div>
            <h1 class="page-header__title" id="form-title">New limit set</h1>
            <p class="page-header__sub" id="form-sub">Set a max and payout ranges for each bet type, then add any special numbers.</p>
          </div>
          <!-- "Copy Template From" (global sets only) + Apply → confirm -->
          <button type="button" class="btn btn--outlined" id="copy-from"><iconify-icon icon="tabler:copy"></iconify-icon>Copy from a global set</button>
        </div>

        <!-- ============ The form ============ -->
        <form class="form-page form-page--wide" id="set-form" novalidate>
          <div class="alert alert--error form-summary" data-form-summary role="alert" hidden>
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body">
              <div class="alert__title"></div>
              <ul class="alert__text"></ul>
            </div>
          </div>

          <div class="stack" data-form-body></div>

          <div class="form-bar">
            <div class="form-bar__status" data-form-status aria-live="polite"></div>
            <div class="form-bar__actions">
              <button type="button" class="btn btn--outlined" data-form-cancel>Cancel</button>
              <button type="submit" class="btn btn--contained" data-form-submit id="form-submit">Create set</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/form.js"></script>
  <script src="../assets/js/domain/lotto.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/lotto.js"></script>
  <script src="../assets/js/pages/limit-template-form.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
