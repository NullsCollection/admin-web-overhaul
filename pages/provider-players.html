<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider players | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Provider players  (Phase 11a, list template)
  Route:  /providers/[id]/players   (provider-players.html?id=101)
  Source: src/pages/providers/[id]/players/index.tsx → views/pages/provider/player/ProviderPlayerTable.tsx
  Data:   useGetPlayers(providerId, { page, pageSize, search })
  Engine: core/list.js   Logic: pages/provider-players.js   Mock: mock/users.js (providerPlayers)
-->
<body data-page="providers" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <div id="provider-header"></div>

        <section class="card list-card" id="players-card" aria-label="Players of this provider">
          <div class="list-toolbar">
            <div class="list-toolbar__search">
              <div class="field__control">
                <iconify-icon icon="tabler:search"></iconify-icon>
                <input type="search" data-list-search placeholder="Search by username or display name" aria-label="Search players">
                <button type="button" class="icon-btn icon-btn--sm" data-list-search-clear aria-label="Clear search" hidden>
                  <iconify-icon icon="tabler:x"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="list-toolbar__end">
              <span class="t-body2 t-muted" data-list-count aria-live="polite"></span>
            </div>
          </div>
          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/users.js"></script>
  <script src="../assets/js/domain/providers.js"></script>
  <script src="../assets/js/pages/provider-players.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
