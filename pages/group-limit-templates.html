<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set lottery number limits | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Set lottery number limits  (Phase 9b, list template)
  Source: src/pages/lotto/group-limit-templates/index.tsx → views/pages/lotto/group-limit-template/useGroupLimitTemplateTable.tsx
  Data:   useGetGroupLimitTemplates({ page, pageSize, orderedBy, search })
  Engine: core/list.js   Page config: pages/group-limit-templates.js   Mock: mock/lotto.js (groupLimitTemplates)
-->
<body data-page="lotto-group-limit-templates" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Page header: title, live count, main action ============ -->
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Set lottery number limits</h1>
            <p class="page-header__sub" data-list-count aria-live="polite">Loading…</p>
          </div>
          <a class="btn btn--contained" href="group-limit-template-form.html">
            <iconify-icon icon="tabler:plus"></iconify-icon>New limit template
          </a>
        </div>

        <!-- ============ How active templates work (the app only says it inside confirm dialogs) ============ -->
        <div class="alert alert--info" role="note" style="margin-bottom:24px">
          <iconify-icon icon="tabler:info-circle"></iconify-icon>
          <div class="alert__body">
            <div class="alert__text">One template is active per scope: one global, and one per owner provider. Turning one on
              turns the others in its scope off. Owners use their active local template, then the global one.</div>
          </div>
        </div>

        <!-- ============ List card: toolbar / table / pagination ============ -->
        <section class="card list-card" id="glt-card" aria-label="Set lottery number limit templates">
          <div class="list-toolbar">
            <div class="list-toolbar__search">
              <div class="field__control">
                <iconify-icon icon="tabler:search"></iconify-icon>
                <input type="search" data-list-search placeholder="Search by template name" aria-label="Search templates">
                <button type="button" class="icon-btn icon-btn--sm" data-list-search-clear aria-label="Clear search" hidden>
                  <iconify-icon icon="tabler:x"></iconify-icon>
                </button>
              </div>
            </div>

            <!-- PROPOSAL: scope filter (the app has search only) -->
            <div class="list-toolbar__filters">
              <div class="field__control field__control--select">
                <select id="f-scope" data-list-filter="scope" aria-label="Scope">
                  <option value="all">All scopes</option>
                  <option value="global">Global</option>
                  <option value="local">Local</option>
                </select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
            </div>

            <div class="list-toolbar__end">
              <button type="button" class="btn btn--text btn--sm" data-list-clear hidden>
                <iconify-icon icon="tabler:x"></iconify-icon>Clear filters
              </button>
            </div>
          </div>

          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/domain/lotto.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/lotto.js"></script>
  <script src="../assets/js/pages/group-limit-templates.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
