<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Game new / edit  (Phase 7c, form template)
  New:  lotto-game-form.html          → src/pages/lotto/games/new.tsx
  Edit: lotto-game-form.html?id=301   → src/pages/lotto/games/[id]/edit.tsx
  Form: src/views/pages/lotto/game/GameForm.tsx (2-step Stepper → one page of cards here)
  Engine: core/form.js (tabs, richtext, imagepick, readonlyIf, options fn). Logic: pages/lotto-game-form.js
-->
<body data-page="lotto-games" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Header ============ -->
        <a class="back-link" href="lotto-games.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>Game management</a>
        <div class="page-header">
          <div>
            <h1 class="page-header__title" id="form-title">New game</h1>
            <p class="page-header__sub" id="form-sub">Set where the game lives and what it pays, then name it and pick its background.</p>
          </div>
        </div>
        <div id="game-tabs"></div>

        <!-- ============ The form ============ -->
        <form class="form-page" id="game-form" novalidate>
          <div class="alert alert--error form-summary" data-form-summary role="alert" hidden>
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body">
              <div class="alert__title"></div>
              <ul class="alert__text"></ul>
            </div>
          </div>

          <div class="stack" data-form-body></div>

          <div class="form-bar">
            <div class="form-bar__status" data-form-status aria-live="polite"></div>
            <div class="form-bar__actions">
              <button type="button" class="btn btn--outlined" data-form-cancel>Cancel</button>
              <button type="submit" class="btn btn--contained" data-form-submit id="form-submit">Create game</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/form.js"></script>
  <script src="../assets/js/domain/lotto.js"></script>
  <script src="../assets/js/mock/lotto.js"></script>
  <script src="../assets/js/pages/lotto-game-form.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
