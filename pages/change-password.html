<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
  <style>
    /* Page-only: a narrow form column (too small for its own CSS file) */
    .narrow { max-width: 640px; }
    .narrow .card__content { display: flex; flex-direction: column; gap: var(--space-4); }
    .narrow .card__footer { justify-content: flex-end; gap: var(--space-2); }
  </style>
</head>

<!--
  PAGE: Change password  (Phase 2, inside the app shell)
  Source: src/pages/change-password/index.tsx → src/views/pages/change-password/useChangePassword.tsx
          (GenericForm: currentPassword, newPassword, confirmPassword; SubmitButtonSet; Cancel → /dashboard)
  Reached from: user menu → Change password (not in the sidebar)
  Logic:  assets/js/pages/auth.js
-->
<body data-page="change-password" data-base="../" data-crumbs="Account|Change password">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Change password</h1>
            <p class="page-header__sub">You're signed in as superadmin.</p>
          </div>
        </div>

        <form class="card narrow" id="change-form" novalidate aria-label="Change password">
          <div class="card__content">
            <div class="field">
              <label class="field__label" for="current">Current password<span class="req">*</span></label>
              <div class="field__control field__control--adorned">
                <input id="current" name="currentPassword" type="password" autocomplete="current-password">
                <button type="button" class="icon-btn icon-btn--sm field__adornment" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <iconify-icon icon="tabler:eye"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="new">New password<span class="req">*</span></label>
              <div class="field__control field__control--adorned">
                <input id="new" name="newPassword" type="password" autocomplete="new-password">
                <button type="button" class="icon-btn icon-btn--sm field__adornment" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <iconify-icon icon="tabler:eye"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="confirm">Confirm new password<span class="req">*</span></label>
              <div class="field__control field__control--adorned">
                <input id="confirm" name="confirmPassword" type="password" autocomplete="new-password">
                <button type="button" class="icon-btn icon-btn--sm field__adornment" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <iconify-icon icon="tabler:eye"></iconify-icon>
                </button>
              </div>
            </div>
          </div>
          <div class="card__footer">
            <a class="btn btn--outlined" href="../index.html">Cancel</a>
            <button type="submit" class="btn btn--contained" id="change-submit">Save changes</button>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
