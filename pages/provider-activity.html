<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider activity | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Provider activity  (Phase 6)
  Source: src/pages/providers/activity/index.tsx → views/pages/provider/activity/ActivityTable.tsx
          + statusGuide.tsx (At risk 3–4 mo, Warning 5–6, Critical 7–8, Severe 9–12)
  Filters: start/end date (default this month), status (All / Active / Inactive); "Inactive providers" count
  Columns: Provider name, Tickets, Cancel tickets, Status, Profit, Last activity time, Last active
  Default sort: is_active asc (least active first)
  Engine: core/list.js   Page config: assets/js/pages/provider-activity.js
-->
<body data-page="provider-activity" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Provider activity</h1>
            <p class="page-header__sub"><span data-list-count>Loading…</span>, least active first.</p>
          </div>
          <!-- totalInactive: also a shortcut to the Inactive filter -->
          <button type="button" class="btn btn--outlined btn--sm inactive-shortcut" id="inactive-shortcut">
            <span class="badge" id="inactive-count">0</span>inactive providers
          </button>
        </div>

        <section class="card list-card" id="activity-card" aria-label="Provider activity">
          <div class="list-toolbar list-toolbar--wrap">
            <div class="field__control list-toolbar__date">
              <span class="field__prefix">From</span>
              <input type="date" data-list-filter="start" value="2026-09-01" max="2026-09-24" aria-label="From date">
            </div>
            <div class="field__control list-toolbar__date">
              <span class="field__prefix">To</span>
              <input type="date" data-list-filter="end" value="2026-09-30" aria-label="To date">
            </div>
            <div class="field__control field__control--select">
              <select data-list-filter="status" id="f-status" aria-label="Status">
                <option value="all">All statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
              </select>
              <iconify-icon icon="tabler:chevron-down"></iconify-icon>
            </div>
            <div class="list-toolbar__end">
              <button type="button" class="btn btn--text btn--sm" data-list-clear hidden>
                <iconify-icon icon="tabler:x"></iconify-icon>Clear filters
              </button>
            </div>
          </div>

          <!-- StatusGuide → a legend for the severity signal -->
          <div class="severity-legend" aria-label="How long since last activity">
            <span>Inactive for</span>
            <span class="severity severity--1"><span class="severity__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>At risk<span class="severity-legend__range">3–4 months</span></span>
            <span class="severity severity--2"><span class="severity__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Warning<span class="severity-legend__range">5–6 months</span></span>
            <span class="severity severity--3"><span class="severity__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Critical<span class="severity-legend__range">7–8 months</span></span>
            <span class="severity severity--4"><span class="severity__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Severe<span class="severity-legend__range">9–12 months</span></span>
          </div>

          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/pages/provider-activity.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
