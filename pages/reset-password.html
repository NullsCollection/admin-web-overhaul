<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Reset password  (Phase 2)
  Source: src/pages/reset-password/index.tsx  (reads ?email=&token= from the emailed link)
  Rules:  password required · confirmPassword required + must match
  Logic:  assets/js/pages/auth.js
-->
<body data-page="reset-password" data-base="../">
  <div class="auth">
    <div class="auth__art" aria-hidden="true"></div>

    <main class="auth__panel">
      <header class="auth__top" id="auth-top"></header>

      <div class="auth__body">
        <!-- ===== Set new password ===== -->
        <form class="auth__form" id="reset-view" novalidate>
          <h1 class="auth__title">Set a new password</h1>
          <p class="auth__lead">For <strong id="reset-email">admin@rb7.com</strong></p>

          <div class="auth__fields">
            <div class="field">
              <label class="field__label" for="password">New password</label>
              <div class="field__control field__control--adorned">
                <input id="password" name="password" type="password" autocomplete="new-password" autofocus>
                <button type="button" class="icon-btn icon-btn--sm field__adornment" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <iconify-icon icon="tabler:eye"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="confirm">Confirm new password</label>
              <div class="field__control field__control--adorned">
                <input id="confirm" name="confirmPassword" type="password" autocomplete="new-password">
                <button type="button" class="icon-btn icon-btn--sm field__adornment" data-toggle-password aria-label="Show password" aria-pressed="false">
                  <iconify-icon icon="tabler:eye"></iconify-icon>
                </button>
              </div>
            </div>
          </div>

          <div class="auth__actions">
            <button type="submit" class="btn btn--contained btn--lg btn--block" id="reset-submit">Reset password</button>
            <a class="auth__back" href="login.html"><iconify-icon icon="tabler:chevron-left"></iconify-icon>Back to log in</a>
          </div>
        </form>

        <!-- ===== Expired / invalid link (new: today a server-error toast) ===== -->
        <div class="auth__form" id="expired-view" hidden>
          <span class="avatar avatar--lg avatar--square avatar--warning auth__icon"><iconify-icon icon="tabler:link-off"></iconify-icon></span>
          <h1 class="auth__title">This link has expired</h1>
          <p class="auth__lead">Reset links only work once and for a limited time. Ask for a new one to continue.</p>
          <div class="auth__actions">
            <a class="btn btn--contained btn--lg btn--block" href="forgot-password.html">Send a new link</a>
            <a class="auth__back" href="login.html"><iconify-icon icon="tabler:chevron-left"></iconify-icon>Back to log in</a>
          </div>
        </div>
      </div>

      <footer class="auth__foot" id="auth-foot"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
