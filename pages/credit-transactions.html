<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit transactions | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Credit transactions  (Phase 9d, list template)
  Source: src/pages/lotto/credit-transactions/index.tsx → views/pages/lotto/credit-transaction/CreditTransactionTable.tsx
  Data:   useGetCreditTransactions({ page, pageSize, search, orderedBy })
  Engine: core/list.js   Page config: pages/credit-transactions.js   Mock: mock/credit.js (creditTransactions)
-->
<body data-page="lotto-credit-transactions" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Credit transactions</h1>
            <p class="page-header__sub" data-list-count aria-live="polite">Loading…</p>
          </div>
        </div>

        <section class="card list-card" id="tx-card" aria-label="Credit transactions">
          <div class="list-toolbar">
            <div class="list-toolbar__search">
              <div class="field__control">
                <iconify-icon icon="tabler:search"></iconify-icon>
                <input type="search" data-list-search placeholder="Search by player or transaction ID" aria-label="Search transactions">
                <button type="button" class="icon-btn icon-btn--sm" data-list-search-clear aria-label="Clear search" hidden>
                  <iconify-icon icon="tabler:x"></iconify-icon>
                </button>
              </div>
            </div>
            <!-- PROPOSAL: credit / debit filter (the app has search only) -->
            <div class="list-toolbar__filters">
              <div class="field__control field__control--select">
                <select data-list-filter="type" aria-label="Credit or debit">
                  <option value="all">All types</option>
                  <option value="credit">Credit</option>
                  <option value="debit">Debit</option>
                </select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
            </div>
            <div class="list-toolbar__end">
              <button type="button" class="btn btn--text btn--sm" data-list-clear hidden>
                <iconify-icon icon="tabler:x"></iconify-icon>Clear filters
              </button>
            </div>
          </div>
          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/credit.js"></script>
  <script src="../assets/js/pages/credit-transactions.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
