<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New limit template | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Set lottery number limit template new / edit  (Phase 9b, form template)
  New:  group-limit-template-form.html          → src/pages/lotto/group-limit-templates/new.tsx
  Edit: group-limit-template-form.html?id=502   → src/pages/lotto/group-limit-templates/[id]/index.tsx
  Form: src/views/pages/lotto/group-limit-template/GroupLimitTemplateForm.tsx
  Engine: core/form.js. Page logic: pages/group-limit-template-form.js
-->
<body data-page="lotto-group-limit-templates" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Header (+ status and Turn on / off on edit) ============ -->
        <a class="back-link" href="group-limit-templates.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>Set lottery number limits</a>
        <div class="page-header form-width">
          <div>
            <div class="page-header__title-row">
              <h1 class="page-header__title" id="form-title">New limit template</h1>
              <span id="form-status"></span>
            </div>
            <p class="page-header__sub" id="form-sub">Name it, pick its scope, then set the three limits.</p>
          </div>
          <div class="page-header__actions" id="form-actions"></div>
        </div>

        <div id="form-note"></div>

        <!-- ============ The form ============ -->
        <form class="form-page" id="glt-form" novalidate>
          <div class="alert alert--error form-summary" data-form-summary role="alert" hidden>
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body">
              <div class="alert__title"></div>
              <ul class="alert__text"></ul>
            </div>
          </div>

          <div class="stack" data-form-body></div>

          <div class="form-bar">
            <div class="form-bar__status" data-form-status aria-live="polite"></div>
            <div class="form-bar__actions">
              <button type="button" class="btn btn--outlined" data-form-cancel>Cancel</button>
              <button type="submit" class="btn btn--contained" data-form-submit id="form-submit">Create template</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/form.js"></script>
  <script src="../assets/js/domain/lotto.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/lotto.js"></script>
  <script src="../assets/js/pages/group-limit-template-form.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
