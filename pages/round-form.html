<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Round new / edit  (Phase 8b, form template)
  New:  round-form.html           → src/pages/lotto/rounds/new.tsx
  Edit: round-form.html?id=8422   → src/pages/lotto/rounds/[id]/index.tsx (RoundForm with defaultValue)
  Form: src/views/pages/lotto/round/RoundForm.tsx (+ SiteDropdown / SyncSiteLockedSites)
  Engine: core/form.js. Logic: pages/round-form.js
-->
<body data-page="lotto-rounds" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">

        <!-- ============ Header ============ -->
        <a class="back-link" href="rounds.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>Round management</a>
        <div class="page-header">
          <div>
            <div class="page-header__title-row">
              <h1 class="page-header__title" id="form-title">New round</h1>
              <span id="form-chip"></span>
            </div>
            <p class="page-header__sub" id="form-sub">Add one round by hand. Most rounds come from round schedules.</p>
          </div>
        </div>

        <!-- ============ The form ============ -->
        <div id="form-notice"></div>
        <form class="form-page" id="round-form" novalidate>
          <div class="alert alert--error form-summary" data-form-summary role="alert" hidden>
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body">
              <div class="alert__title"></div>
              <ul class="alert__text"></ul>
            </div>
          </div>

          <div class="stack" data-form-body></div>

          <div class="form-bar">
            <div class="form-bar__status" data-form-status aria-live="polite"></div>
            <div class="form-bar__actions">
              <button type="button" class="btn btn--outlined" data-form-cancel>Cancel</button>
              <button type="submit" class="btn btn--contained" data-form-submit id="form-submit">Create round</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/form.js"></script>
  <script src="../assets/js/domain/lotto.js"></script>
  <script src="../assets/js/domain/rounds.js"></script>
  <script src="../assets/js/mock/lotto.js"></script>
  <script src="../assets/js/mock/rounds.js"></script>
  <script src="../assets/js/pages/round-form.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
