<!--
  PAGE: Credit transaction details  (Phase 9d, detail template)
  Route:  /lotto/credit-transactions/[id]   (credit-transaction.html?id=78812400)

            </div>
            <p class="page-header__sub" id="t-sub"></p>
          </div>
        </div>

        <div id="t-problem" hidden></div>
        <section class="card summary" aria-label="Transaction" id="t-summary"></section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
