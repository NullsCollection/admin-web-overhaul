<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New user group | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: User group new / edit  (Phase 11c, form template + permission grid)
  New:  user-group-form.html       → src/pages/user-groups/new.tsx
  Edit: user-group-form.html?id=2  → src/pages/user-groups/[id]/edit.tsx
  Form: views/pages/user-group/UserGroupForm.tsx   Data: useGetPermissions({ search, page: 1, pageSize: 500 })
  Engine: core/form.js (+ custom permission grid). Page logic: pages/user-group-form.js
-->
<body data-page="user-groups" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <a class="back-link" href="user-groups.html"><iconify-icon icon="tabler:arrow-left"></iconify-icon>User groups</a>
        <div class="page-header">
          <div>
            <h1 class="page-header__title" id="form-title">New user group</h1>
            <p class="page-header__sub" id="form-sub">Name the group, then pick what it can do.</p>
          </div>
        </div>

        <form class="form-page" id="ug-form" novalidate>
          <div class="alert alert--error form-summary" data-form-summary role="alert" hidden>
            <iconify-icon icon="tabler:alert-triangle"></iconify-icon>
            <div class="alert__body">
              <div class="alert__title"></div>
              <ul class="alert__text"></ul>
            </div>
          </div>
          <div class="stack" data-form-body></div>
          <div class="form-bar">
            <div class="form-bar__status" data-form-status aria-live="polite"></div>
            <div class="form-bar__actions">
              <button type="button" class="btn btn--outlined" data-form-cancel>Cancel</button>
              <button type="submit" class="btn btn--contained" data-form-submit id="form-submit">Create group</button>
            </div>
          </div>
        </form>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/form.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/users.js"></script>
  <script src="../assets/js/pages/user-group-form.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
