<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: Forgot password  (Phase 2)
  Source: src/pages/forgot-password/index.tsx  (requestResetPassword(email), toasts: sending/sent/failed)
  Copy:   public/locales/*/forgot-password.json  (fixes "Send rest link" typo → "Send reset link")
  Logic:  assets/js/pages/auth.js
-->
<body data-page="forgot-password" data-base="../">
  <div class="auth">
    <div class="auth__art" aria-hidden="true"></div>

    <main class="auth__panel">
      <header class="auth__top" id="auth-top"></header>

      <div class="auth__body">
        <!-- ===== Request form ===== -->
        <form class="auth__form" id="forgot-view" novalidate>
          <h1 class="auth__title">Forgot your password?</h1>
          <p class="auth__lead">Enter your email and we'll send you a link to reset it.</p>

          <div class="auth__fields">
            <div class="field">
              <label class="field__label" for="email">Email</label>
              <div class="field__control">
                <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" autofocus>
              </div>
            </div>
          </div>

          <div class="auth__actions">
            <button type="submit" class="btn btn--contained btn--lg btn--block" id="forgot-submit">Send reset link</button>
            <a class="auth__back" href="login.html"><iconify-icon icon="tabler:chevron-left"></iconify-icon>Back to log in</a>
          </div>
        </form>

        <!-- ===== Sent (new: replaces the "Email sent" toast) ===== -->
        <div class="auth__form" id="sent-view" hidden>
          <span class="avatar avatar--lg avatar--square avatar--primary auth__icon"><iconify-icon icon="tabler:mail-check"></iconify-icon></span>
          <h1 class="auth__title" id="sent-title" tabindex="-1">Check your email</h1>
          <p class="auth__lead">We sent a reset link to <strong id="sent-email">admin@rb7.com</strong>. It can take a few minutes to arrive.</p>
          <div class="auth__actions">
            <a class="btn btn--contained btn--lg btn--block" href="login.html">Back to log in</a>
            <button type="button" class="btn btn--text" id="resend">Didn't get it? Send again</button>
          </div>
        </div>
      </div>

      <footer class="auth__foot" id="auth-foot"></footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
