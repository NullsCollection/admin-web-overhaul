<!doctype html>
<html lang="en" data-theme="gold" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User management | Admin prototype</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="../assets/js/core/theme.js"></script>
</head>

<!--
  PAGE: User management  (Phase 11c, list template)
  Source: src/pages/users/index.tsx → views/pages/user/UserTable.tsx
  Data:   useGetUsers({ page, pageSize, search, filter: { providerId } })
  Engine: core/list.js   Logic: pages/users.js   Mock: mock/users.js (users)
-->
<body data-page="users" data-base="../">
  <div class="app">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app__main">
      <header class="topbar" id="app-topbar"></header>

      <main class="content" id="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">User management</h1>
            <p class="page-header__sub" data-list-count aria-live="polite">Loading…</p>
          </div>
          <a class="btn btn--contained" href="user-form.html"><iconify-icon icon="tabler:plus"></iconify-icon>New user</a>
        </div>

        <section class="card list-card" id="users-card" aria-label="Users">
          <div class="list-toolbar">
            <div class="list-toolbar__search">
              <div class="field__control">
                <iconify-icon icon="tabler:search"></iconify-icon>
                <input type="search" data-list-search placeholder="Search by name or email" aria-label="Search users">
                <button type="button" class="icon-btn icon-btn--sm" data-list-search-clear aria-label="Clear search" hidden>
                  <iconify-icon icon="tabler:x"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="list-toolbar__filters">
              <!-- Provider (Autocomplete in the app). "Admins" = users with no provider (proposal) -->
              <div class="field__control field__control--select">
                <select id="f-provider" data-list-filter="provider" aria-label="Provider"></select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
              <!-- PROPOSAL: user group filter -->
              <div class="field__control field__control--select">
                <select id="f-group" data-list-filter="group" aria-label="User group"></select>
                <iconify-icon icon="tabler:chevron-down"></iconify-icon>
              </div>
            </div>
            <div class="list-toolbar__end">
              <button type="button" class="btn btn--text btn--sm" data-list-clear hidden>
                <iconify-icon icon="tabler:x"></iconify-icon>Clear filters
              </button>
            </div>
          </div>
          <div class="list-body" aria-live="polite"></div>
          <div data-list-pager></div>
        </section>
      </main>

      <footer class="footer" id="app-footer"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <script src="../assets/js/core/format.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/nav.js"></script>
  <script src="../assets/js/core/shell.js"></script>
  <script src="../assets/js/core/dialog.js"></script>
  <script src="../assets/js/core/list.js"></script>
  <script src="../assets/js/mock/providers.js"></script>
  <script src="../assets/js/mock/users.js"></script>
  <script src="../assets/js/pages/users.js"></script>
  <script src="../assets/js/core/devbar.js"></script>
</body>
</html>
